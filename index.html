<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRTD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth" id="auth">
    <form class="auth__panel" id="auth-form" novalidate>
      <h1 class="auth__title">MRTD</h1>
      <p class="auth__mode">Log in or sign up</p>

      <label class="auth__field">
        <span class="auth__label">Username</span>
        <input class="auth__input" id="auth-username" type="text" autocomplete="username" required>
      </label>

      <label class="auth__field">
        <span class="auth__label">Password</span>
        <input class="auth__input" id="auth-password" type="password" autocomplete="current-password" required>
      </label>

      <label class="auth__field auth__field--reveal" id="auth-confirm-field" hidden>
        <span class="auth__label">Confirm password</span>
        <input class="auth__input" id="auth-confirm" type="password" autocomplete="new-password">
      </label>

      <div class="auth__actions">
        <button class="auth__button is-primary" id="auth-login" type="button">Log in</button>
        <button class="auth__button" id="auth-signup" type="button">Sign up</button>
      </div>

      <p class="auth__message" id="auth-message"></p>
    </form>
  </section>

  <div class="app" id="app" hidden>
    <main class="screens">
      <section class="screen is-active" id="screen-play" data-screen="play">
        <div class="profile-card">
          <div class="profile-card__avatar"></div>
          <div class="profile-card__info">
            <p class="profile-card__name">Player Name</p>
            <p class="profile-card__level">Level 1</p>
          </div>
        </div>

        <button class="play-button" id="play" type="button">Play</button>
      </section>

      <section class="screen" id="screen-towers" data-screen="towers">
        <p class="placeholder">Towers</p>

        <div class="loadout">
          <p class="loadout__label">Equipped · 5 slots</p>
          <div class="loadout__slots" id="loadout-slots"></div>

          <p class="loadout__label">Owned</p>
          <p class="loadout__status" id="loadout-status"></p>
          <div class="loadout__owned" id="loadout-owned"></div>
        </div>
      </section>

      <section class="screen" id="screen-shop" data-screen="shop">
        <p class="placeholder">Shop</p>

        <div class="shop">
          <div class="shop__roll" id="shop-roll" hidden>
            <p class="shop__roll-label">Welcome gift</p>
            <button class="shop__roll-button" id="shop-roll-button" type="button">
              Open free roll
            </button>
            <p class="shop__roll-note">One roll, once ever. Every tower equally likely.</p>
          </div>

          <div class="shop__chest">
            <p class="shop__balance"><span id="shop-coins">0</span> coins</p>
            <div class="shop__buys">
              <button class="shop__buy" id="shop-buy-1" type="button">Summon ×1 — 100</button>
              <button class="shop__buy" id="shop-buy-10" type="button">Summon ×10 — 900</button>
            </div>
            <p class="shop__odds" id="shop-odds"></p>
          </div>

          <p class="shop__status" id="shop-status"></p>

          <div class="shop__collection" id="shop-collection"></div>
        </div>
      </section>

      <section class="screen" id="screen-upgrades" data-screen="upgrades">
        <p class="placeholder">Player Upgrades</p>
      </section>
    </main>

    <div class="corner">
      <button class="corner__dev" id="devmode" type="button" hidden>Dev mode: off</button>
      <button class="corner__signout" id="signout" type="button">Sign out</button>
      <p class="version" id="version"></p>
    </div>

    <nav class="nav">
      <button class="nav__tab is-active" type="button" data-tab="play">Play</button>
      <button class="nav__tab" type="button" data-tab="towers">Towers</button>
      <button class="nav__tab" type="button" data-tab="shop">Shop</button>
      <button class="nav__tab" type="button" data-tab="upgrades">Player Upgrades</button>
    </nav>
  </div>

  <div class="match" id="match" hidden>
    <canvas class="match__canvas" id="match-canvas"></canvas>

    <div class="match__top">
      <p class="match__stat"><span id="match-wave">0</span> wave</p>
      <button class="match__button" id="match-speed" type="button">1×</button>
      <button class="match__button" id="match-skip" type="button" hidden>Skip wave</button>
      <button class="match__button match__button--go" id="match-start" type="button">
        Start wave
      </button>
    </div>

    <div class="match__hud">
      <p class="match__stat"><span id="match-cash">0</span> cash</p>
      <p class="match__stat"><span id="match-hp">0</span> hp</p>

      <div class="hotbar" id="hotbar"></div>

      <button class="match__button" id="match-view" type="button">View: Top</button>
      <button class="match__button" id="match-forfeit" type="button">Forfeit</button>
      <button class="match__button" id="match-exit" type="button" disabled>Leave</button>
    </div>

    <div class="gameover" id="gameover" hidden>
      <div class="gameover__panel">
        <h2 class="gameover__title">Base destroyed</h2>
        <p class="gameover__line">Waves beaten <span id="gameover-waves">0</span></p>
        <p class="gameover__reward"><span id="gameover-coins">0</span> coins</p>
        <p class="gameover__note" id="gameover-note" hidden>Dev mode — nothing banked</p>
        <button class="gameover__button" id="gameover-leave" type="button">
          Back to lobby
        </button>
      </div>
    </div>
  </div>

  <script src="stats.js"></script>
  <script src="script.js"></script>
  <script src="loadout.js"></script>
  <script src="shop.js"></script>
  <script src="match.js"></script>
</body>
</html>
